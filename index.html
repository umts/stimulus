<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UMTS Stimulus</title>
    <link rel="stylesheet" href="/demo/index.scss" />
    <script type="module" src="/demo/index.ts"></script>
  </head>
  <body>
    <section class="container my-3">
      <h1>UMTS Stimulus</h1>
      <hr />
      <div class="card">
        <div class="card-header">TomSelectController</div>
        <div class="card-body">
          <div class="mb-3">
            <label for="basic-select" class="form-label">Basic select</label>
            <select id="basic-select" class="form-select" data-controller="tom-select">
              <option value="0"></option>
              <option value="1">Option 1</option>
              <option value="2">Option 2</option>
              <option value="3">Option 3</option>
              <option value="4">Option 4</option>
              <option value="5">Option 5</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="search-select" class="form-label">Basic select</label>
            <select id="search-select" class="form-select" data-controller="tom-select" data-search>
              <option value="0"></option>
              <option value="1">Option 1</option>
              <option value="2">Option 2</option>
              <option value="3">Option 3</option>
              <option value="4">Option 4</option>
              <option value="5">Option 5</option>
            </select>
          </div>
          <div>
            <label for="multi-select" class="form-label">Basic select</label>
            <select
              multiple
              id="multi-select"
              class="form-select"
              data-controller="tom-select"
              data-search
            >
              <option value="0"></option>
              <option value="1">Option 1</option>
              <option value="2">Option 2</option>
              <option value="3">Option 3</option>
              <option value="4">Option 4</option>
              <option value="5">Option 5</option>
            </select>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
